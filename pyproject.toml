[project]
name = "showonce"
version = "0.1.0"
description = "Teach a simulated robot arm a tabletop task by filming it once."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abu Bakar Siddik", email = "abubakar@casemaxplus.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.7.0",
    "mujoco>=3.17.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uvicorn>=0.30",
]

[project.scripts]
showonce = "showonce.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
tools = [
    "google-genai>=2.34.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["mujoco.*", "cv2.*", "imageio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: calls the real Meta API (needs MODEL_API_KEY)"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
